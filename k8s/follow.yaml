apiVersion: apps/v1
kind: Deployment
metadata:
  name: follow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: follow
  template:
    metadata:
      labels:
        app: follow
    spec:
      containers:
        - name: follow
          image: ghcr.io/drm0011/xclone-follow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: follow
spec:
  selector:
    app: follow
  ports:
    - port: 8093
      targetPort: 8080
