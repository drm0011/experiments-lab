# Copy to a real secret; do NOT commit real values.
# kubectl create secret generic postgres-secret \
#   --from-literal=DB_PASSWORD='<dev-password>' \
#   --from-literal=IDENTITY_CONNECTION_STRING='Host=postgres;Port=5432;Database=identity_db;Username=xclone;Password=<dev-password>'
# In CI (deploy-smoke) the same secret is created from GitHub repo secrets.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
  IDENTITY_CONNECTION_STRING: "Host=postgres;Port=5432;Database=identity_db;Username=xclone;Password=CHANGE_ME"
