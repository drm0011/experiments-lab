name: inventory

on:
  push:
    paths:
      - 'projects/microservices-playground/services/inventory/**'
      - 'contracts/inventory-openapi.json'
      - '.github/workflows/inventory.yml'
  pull_request:
    paths:
      - 'projects/microservices-playground/services/inventory/**'
      - 'contracts/inventory-openapi.json'
      - '.github/workflows/inventory.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build projects/microservices-playground/services/inventory/Inventory.Api.csproj
      - name: Build container image
        working-directory: projects/microservices-playground
        run: docker build -f services/inventory/Dockerfile -t playground-inventory:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: playground-inventory:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        run: |
          docker tag playground-inventory:ci ghcr.io/drm0011/playground-inventory:sha-${{ github.sha }}
          docker tag playground-inventory:ci ghcr.io/drm0011/playground-inventory:latest
          docker push ghcr.io/drm0011/playground-inventory:sha-${{ github.sha }}
          docker push ghcr.io/drm0011/playground-inventory:latest
