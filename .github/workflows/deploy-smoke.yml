name: deploy-smoke

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'projects/x-clone/**'
      - '.github/workflows/deploy-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install k3d
        run: |
          curl -sL "https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64" -o k3d
          chmod +x k3d
          sudo mv k3d /usr/local/bin/

      - name: Build images locally (registry-independent smoke)
        working-directory: projects/x-clone
        run: |
          docker build -f services/identity/Dockerfile -t ghcr.io/drm0011/xclone-identity:latest .
          docker build -f services/post/Dockerfile -t ghcr.io/drm0011/xclone-post:latest .
          docker build -f services/follow/Dockerfile -t ghcr.io/drm0011/xclone-follow:latest .
          docker build -f services/timeline/Dockerfile -t ghcr.io/drm0011/xclone-timeline:latest .
          docker build -f frontend/Dockerfile -t ghcr.io/drm0011/xclone-frontend:latest frontend

      - name: Create ephemeral cluster
        run: k3d cluster create smoke --wait

      - name: Import images into the cluster
        run: |
          k3d image import ghcr.io/drm0011/xclone-identity:latest \
                           ghcr.io/drm0011/xclone-post:latest \
                           ghcr.io/drm0011/xclone-follow:latest \
                           ghcr.io/drm0011/xclone-timeline:latest \
                           ghcr.io/drm0011/xclone-frontend:latest -c smoke

      - name: Deploy the stack
        run: |
          kubectl create secret generic postgres-secret \
            --from-literal=DB_PASSWORD="${{ secrets.XCLONE_DB_PASSWORD }}" \
            --from-literal=IDENTITY_CONNECTION_STRING="${{ secrets.XCLONE_IDENTITY_CONNECTION_STRING }}"
          kubectl apply -f k8s/
          kubectl rollout status deploy/identity --timeout=180s
          kubectl rollout status deploy/post --timeout=180s
          kubectl rollout status deploy/follow --timeout=180s
          kubectl rollout status deploy/timeline --timeout=180s
          kubectl rollout status deploy/frontend --timeout=180s

      - name: Smoke test health endpoints
        run: |
          kubectl port-forward svc/identity 18091:8091 >/tmp/pf1.log 2>&1 &
          kubectl port-forward svc/post 18092:8092 >/tmp/pf2.log 2>&1 &
          kubectl port-forward svc/follow 18093:8093 >/tmp/pf3.log 2>&1 &
          kubectl port-forward svc/timeline 18094:8094 >/tmp/pf4.log 2>&1 &
          kubectl port-forward svc/frontend 15174:5174 >/tmp/pf5.log 2>&1 &
          sleep 8
          {
            echo "# deploy-smoke - $(date -Iseconds)"
            echo
            for pair in "identity:18091" "post:18092" "follow:18093" "timeline:18094"; do
              name="${pair%%:*}"; port="${pair##*:}"
              echo "\$ GET /health $name (expect 200)"
              curl -s -w " [%{http_code}]" "http://localhost:$port/health"
              echo
            done
            echo "\$ GET frontend (expect 200)"
            curl -s -o /dev/null -w "[%{http_code}]" http://localhost:15174
            echo
          } > smoke-results.txt
          cat smoke-results.txt
          grep -q "200" smoke-results.txt || { echo "FAIL: health check failed"; exit 1; }

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-results.txt

      - name: Tear down cluster
        if: always()
        run: k3d cluster delete smoke
