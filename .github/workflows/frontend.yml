name: frontend

on:
  push:
    paths:
      - 'projects/x-clone/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'projects/x-clone/frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/x-clone/frontend/package-lock.json
      - run: npm install
        working-directory: projects/x-clone/frontend
      - run: npm run build
        working-directory: projects/x-clone/frontend
      - name: Build container image
        working-directory: projects/x-clone/frontend
        run: docker build -t xclone-frontend:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: xclone-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        run: |
          docker tag xclone-frontend:ci ghcr.io/drm0011/xclone-frontend:sha-${{ github.sha }}
          docker tag xclone-frontend:ci ghcr.io/drm0011/xclone-frontend:latest
          docker push ghcr.io/drm0011/xclone-frontend:sha-${{ github.sha }}
          docker push ghcr.io/drm0011/xclone-frontend:latest
