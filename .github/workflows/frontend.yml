name: frontend

on:
  push:
    paths:
      - 'projects/microservices-playground/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'projects/microservices-playground/frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/microservices-playground/frontend/package-lock.json
      - run: npm install
        working-directory: projects/microservices-playground/frontend
      - run: npm run build
        working-directory: projects/microservices-playground/frontend
      - name: Build container image
        working-directory: projects/microservices-playground/frontend
        run: docker build -t playground-frontend:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: playground-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
