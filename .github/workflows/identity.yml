name: identity

on:
  push:
    paths:
      - 'projects/x-clone/services/identity/**'
      - 'projects/x-clone/tests/Identity.Service.Tests/**'
      - '.github/workflows/identity.yml'
  pull_request:
    paths:
      - 'projects/x-clone/services/identity/**'
      - 'projects/x-clone/tests/Identity.Service.Tests/**'
      - '.github/workflows/identity.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xclone
          POSTGRES_PASSWORD: xclone-dev
          POSTGRES_DB: identity_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xclone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build projects/x-clone/services/identity/Identity.Service.csproj
      - name: Run tests
        env:
          TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=identity_test_db;Username=xclone;Password=xclone-dev"
        run: dotnet test projects/x-clone/tests/Identity.Service.Tests/Identity.Service.Tests.csproj
      - name: Build container image
        working-directory: projects/x-clone
        run: docker build -f services/identity/Dockerfile -t xclone-identity:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: xclone-identity:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        run: |
          docker tag xclone-identity:ci ghcr.io/drm0011/xclone-identity:sha-${{ github.sha }}
          docker tag xclone-identity:ci ghcr.io/drm0011/xclone-identity:latest
          docker push ghcr.io/drm0011/xclone-identity:sha-${{ github.sha }}
          docker push ghcr.io/drm0011/xclone-identity:latest
