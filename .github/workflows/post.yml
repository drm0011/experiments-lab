name: post

on:
  push:
    paths:
      - 'projects/x-clone/services/post/**'
      - '.github/workflows/post.yml'
  pull_request:
    paths:
      - 'projects/x-clone/services/post/**'
      - '.github/workflows/post.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build projects/x-clone/services/post/Post.Service.csproj
      - name: Build container image
        working-directory: projects/x-clone
        run: docker build -f services/post/Dockerfile -t xclone-post:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: xclone-post:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        run: |
          docker tag xclone-post:ci ghcr.io/drm0011/xclone-post:sha-${{ github.sha }}
          docker tag xclone-post:ci ghcr.io/drm0011/xclone-post:latest
          docker push ghcr.io/drm0011/xclone-post:sha-${{ github.sha }}
          docker push ghcr.io/drm0011/xclone-post:latest
