services:
  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
      - "8081:8080"

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    ports:
      - "8082:8080"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - catalog
      - orders
