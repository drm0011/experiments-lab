services:
  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
      - "8081:8080"

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    ports:
      - "8083:8080"

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    environment:
      INVENTORY_URL: http://inventory:8080
    ports:
      - "8082:8080"
    depends_on:
      - inventory

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - catalog
      - orders
